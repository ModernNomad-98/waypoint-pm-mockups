<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WayPoint — Projects, workflows &amp; templates</title>
<meta name="description" content="Interactive WayPoint prototype for project workflows and templates. Synthetic data only.">
<style>
/* ============ Tokens ============ */
:root{
  --radius:0.75rem; --radius-sm:0.5rem;
  --background:oklch(0.985 0.003 250);
  --foreground:oklch(0.21 0.03 264);
  --card:oklch(1 0 0);
  --card-foreground:oklch(0.21 0.03 264);
  --popover:oklch(1 0 0);
  --popover-foreground:oklch(0.21 0.03 264);
  --primary:#4f46e5;
  --primary-hover:#4338ca;
  --primary-soft:oklch(0.95 0.02 277);
  --primary-foreground:oklch(0.985 0.003 250);
  --secondary:oklch(0.965 0.008 250);
  --secondary-foreground:oklch(0.25 0.03 264);
  --muted:oklch(0.965 0.008 250);
  --muted-foreground:oklch(0.52 0.03 257);
  --accent:oklch(0.95 0.02 277);
  --accent-foreground:oklch(0.3 0.07 277);
  --destructive:#dc2626;
  --destructive-foreground:#fff;
  --border:oklch(0.92 0.008 255);
  --input:oklch(0.92 0.008 255);
  --ring:oklch(0.55 0.19 277);
  --sidebar:oklch(0.985 0.005 255);
  --sidebar-foreground:oklch(0.3 0.03 264);
  --sidebar-accent:oklch(0.95 0.015 277);
  --sidebar-border:oklch(0.92 0.008 255);
  --skeleton:oklch(0.55 0.19 277 / 0.12);
  --shadow-soft:0 1px 2px 0 oklch(0.21 0.03 264 / 0.05);
  --shadow-card:0 1px 3px 0 oklch(0.21 0.03 264 / 0.07), 0 1px 2px -1px oklch(0.21 0.03 264 / 0.05);
  --shadow-pop:0 18px 40px -16px oklch(0.21 0.03 264 / 0.30), 0 4px 12px -6px oklch(0.21 0.03 264 / 0.18);
  /* status chips */
  --st-progress-bg:oklch(0.94 0.04 250); --st-progress-fg:oklch(0.4 0.15 250);
  --st-planning-bg:oklch(0.95 0.04 90);  --st-planning-fg:oklch(0.45 0.13 75);
  --st-hold-bg:oklch(0.95 0.02 30);      --st-hold-fg:oklch(0.45 0.12 30);
  --st-done-bg:oklch(0.94 0.05 160);     --st-done-fg:oklch(0.4 0.13 160);
  --st-blocked-bg:oklch(0.94 0.05 25);   --st-blocked-fg:oklch(0.45 0.18 25);
  --st-review-bg:oklch(0.94 0.04 300);   --st-review-fg:oklch(0.42 0.15 300);
  --st-neutral-bg:oklch(0.96 0.004 257); --st-neutral-fg:oklch(0.45 0.03 257);
  --warn-bg:oklch(0.97 0.02 80); --warn-fg:oklch(0.45 0.11 60); --warn-border:oklch(0.9 0.06 80);
  --danger-bg:oklch(0.97 0.02 25); --danger-fg:oklch(0.5 0.15 25); --danger-border:oklch(0.9 0.05 25);
  --info-bg:oklch(0.97 0.015 277); --info-fg:oklch(0.4 0.1 277); --info-border:oklch(0.9 0.04 277);
  --font-sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
}
[data-theme="dark"]{
  --background:oklch(0.129 0.042 264.7);
  --foreground:oklch(0.984 0.003 247.9);
  --card:oklch(0.208 0.042 265.8);
  --card-foreground:oklch(0.984 0.003 247.9);
  --popover:oklch(0.208 0.042 265.8);
  --popover-foreground:oklch(0.984 0.003 247.9);
  --primary:oklch(0.7 0.18 277);
  --primary-hover:oklch(0.75 0.18 277);
  --primary-soft:oklch(0.3 0.09 277);
  --primary-foreground:oklch(0.15 0.04 264);
  --secondary:oklch(0.279 0.041 260);
  --secondary-foreground:oklch(0.984 0.003 247.9);
  --muted:oklch(0.279 0.041 260);
  --muted-foreground:oklch(0.704 0.04 256.8);
  --accent:oklch(0.279 0.041 260);
  --accent-foreground:oklch(0.984 0.003 247.9);
  --destructive:oklch(0.704 0.191 22.2);
  --destructive-foreground:oklch(0.984 0.003 247.9);
  --border:oklch(1 0 0 / 0.11);
  --input:oklch(1 0 0 / 0.16);
  --sidebar:oklch(0.179 0.042 265);
  --sidebar-foreground:oklch(0.984 0.003 247.9);
  --sidebar-accent:oklch(0.279 0.041 260);
  --sidebar-border:oklch(1 0 0 / 0.11);
  --skeleton:oklch(0.7 0.18 277 / 0.18);
  --st-progress-bg:oklch(0.3 0.08 250); --st-progress-fg:oklch(0.85 0.1 250);
  --st-planning-bg:oklch(0.3 0.07 75);  --st-planning-fg:oklch(0.85 0.1 75);
  --st-hold-bg:oklch(0.3 0.06 30);      --st-hold-fg:oklch(0.85 0.1 30);
  --st-done-bg:oklch(0.3 0.08 160);     --st-done-fg:oklch(0.85 0.1 160);
  --st-blocked-bg:oklch(0.3 0.09 25);   --st-blocked-fg:oklch(0.85 0.12 25);
  --st-review-bg:oklch(0.3 0.08 300);   --st-review-fg:oklch(0.85 0.1 300);
  --st-neutral-bg:oklch(0.3 0.02 264);  --st-neutral-fg:oklch(0.8 0.03 264);
  --warn-bg:oklch(0.25 0.05 80); --warn-fg:oklch(0.85 0.12 80); --warn-border:oklch(0.5 0.1 80 / 0.4);
  --danger-bg:oklch(0.25 0.06 25); --danger-fg:oklch(0.85 0.14 25); --danger-border:oklch(0.55 0.14 25 / 0.4);
  --info-bg:oklch(0.24 0.05 277); --info-fg:oklch(0.85 0.08 277); --info-border:oklch(0.5 0.12 277 / 0.4);
  --shadow-soft:0 1px 2px 0 oklch(0 0 0 / 0.3);
  --shadow-card:0 1px 3px 0 oklch(0 0 0 / 0.4);
  --shadow-pop:0 18px 40px -16px oklch(0 0 0 / 0.6);
}
/* ============ Base ============ */
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{margin:0;font-family:var(--font-sans);font-size:14px;line-height:1.5;color:var(--foreground);background:var(--background);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p,ul,ol,dl,dd,figure{margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}
img,svg{display:inline-block;vertical-align:middle}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:4px}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip-link{position:absolute;left:12px;top:-44px;z-index:200;background:var(--primary);color:var(--primary-foreground);padding:8px 14px;border-radius:8px;font-weight:500;transition:top .15s}
.skip-link:focus{top:12px}
.ic{width:16px;height:16px;flex:none}
.ic-sm{width:14px;height:14px}
.ic-lg{width:20px;height:20px}
.muted{color:var(--muted-foreground)}
.text-xs{font-size:12px}
.text-sm{font-size:13px}
.flex{display:flex}
.gap-2{gap:8px}
.gap-3{gap:12px}
.items-center{align-items:center}
.fw-500{font-weight:500}
.fw-600{font-weight:600}
.mt-2{margin-top:8px}
.mt-3{margin-top:12px}
.mt-4{margin-top:16px}
.mb-2{margin-bottom:8px}
.mb-3{margin-bottom:12px}
.mb-4{margin-bottom:16px}
.nowrap{white-space:nowrap}
/* ============ App layout ============ */
.app{display:flex;min-height:100dvh}
.sidebar{width:232px;flex:none;background:var(--sidebar);border-right:1px solid var(--sidebar-border);display:flex;flex-direction:column;position:sticky;top:0;height:100dvh;z-index:40}
.side-head{padding:14px 14px 8px}
.brand{display:flex;align-items:center;gap:10px;color:var(--sidebar-foreground);text-decoration:none}
.brand:hover{text-decoration:none}
.brand-mark{width:28px;height:28px;border-radius:8px}
.brand-mark .fill-primary{fill:var(--primary)}
.brand-mark .fill-primary-foreground{fill:var(--primary-foreground)}
.brand-name{display:flex;flex-direction:column;line-height:1.15;font-size:14px;font-weight:600}
.brand-name small{font-size:9.5px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--muted-foreground)}
.side-nav{flex:1;overflow-y:auto;padding:6px 8px;display:flex;flex-direction:column;gap:2px}
.side-item{display:flex;align-items:center;gap:12px;padding:7px 10px;border-radius:8px;color:var(--sidebar-foreground);font-size:13.5px;width:100%;text-align:left}
.side-item:hover{background:var(--sidebar-accent)}
.side-item.active{background:var(--accent);color:var(--accent-foreground);font-weight:500}
.side-item .ic{color:var(--muted-foreground)}
.side-item.active .ic{color:var(--accent-foreground)}
.side-foot{border-top:1px solid var(--sidebar-border);padding:10px;display:flex;flex-direction:column;gap:10px}
.tenant-block{display:flex;align-items:center;gap:8px;padding:7px 8px;border:1px solid var(--sidebar-border);border-radius:8px;background:var(--sidebar-accent)}
.tenant-logo{width:30px;height:30px;flex:none;display:grid;place-items:center;border-radius:7px;background:var(--card);border:1px solid var(--sidebar-border);font-size:11px;font-weight:600;color:var(--sidebar-foreground)}
.tenant-meta{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.tenant-meta b{font-size:12px;font-weight:600;color:var(--sidebar-foreground)}
.tenant-meta i{font-size:10.5px;font-style:normal;color:var(--muted-foreground);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.user-block{display:flex;align-items:center;gap:10px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-size:11.5px;font-weight:600;flex:none}
.user-meta{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.user-meta b{font-size:13px;font-weight:500;color:var(--sidebar-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-meta i{font-size:11px;font-style:normal;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-backdrop{position:fixed;inset:0;background:oklch(0 0 0 / 0.35);z-index:35}
/* collapsed (desktop) */
body.sb-collapsed .sidebar{width:60px}
body.sb-collapsed .brand-name,body.sb-collapsed .tenant-meta,body.sb-collapsed .user-meta,body.sb-collapsed .side-item span{display:none}
body.sb-collapsed .side-item{justify-content:center;padding:9px 0}
body.sb-collapsed .side-head{padding:14px 16px 8px}
body.sb-collapsed .tenant-block{justify-content:center;border:0;background:none;padding:4px 0}
/* ============ Top nav ============ */
.main-col{flex:1;min-width:0;display:flex;flex-direction:column}
.topnav{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;height:56px;padding:0 16px;background:var(--card);border-bottom:1px solid var(--border)}
.btn-icon{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:8px;color:var(--muted-foreground)}
.btn-icon:hover{background:var(--muted);color:var(--foreground)}
.search-wrap{flex:1;min-width:0;max-width:420px;display:flex;align-items:center;gap:8px;height:36px;padding:0 10px;border:1px solid var(--input);border-radius:8px;background:var(--background);color:var(--muted-foreground)}
.search-input{border:0;outline:0;background:transparent;flex:1;min-width:0;font-size:13.5px}
.search-input::placeholder{color:var(--muted-foreground)}
.tenant-name{font-size:12.5px;color:var(--muted-foreground)}
.topnav-right{margin-left:auto;display:flex;align-items:center;gap:8px;position:relative}
.avatar-btn{border-radius:50%}
.avatar-btn:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
/* menu popovers */
.wrap{position:relative}
.menu{position:absolute;top:calc(100% + 6px);right:0;z-index:60;min-width:220px;background:var(--popover);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-pop);padding:6px;color:var(--popover-foreground)}
.menu-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:7px 10px;border-radius:7px;font-size:13.5px}
.menu-item:hover{background:var(--muted)}
.menu-item .ic{color:var(--muted-foreground)}
.menu-item[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.menu-sep{height:1px;background:var(--border);margin:5px 4px}
.menu-label{padding:6px 10px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted-foreground);font-weight:600}
/* ============ Mock strip ============ */
.mock-strip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 16px;border-bottom:1px solid var(--border);background:var(--accent);font-size:12px}
.mock-chip{font-weight:600;color:var(--accent-foreground)}
.mock-note{color:var(--muted-foreground)}
.mock-field{display:flex;align-items:center;gap:6px}
.mock-field label{color:var(--muted-foreground);font-size:12px}
.mock-select{height:30px;border:1px solid var(--input);border-radius:7px;background:var(--card);padding:0 8px;font-size:12px;color:var(--foreground)}
.sim-chip{background:var(--st-hold-bg);color:var(--st-hold-fg);border-radius:99px;padding:2px 10px;font-size:11px;font-weight:600}
.mock-spacer{margin-left:auto}
/* ============ Breadcrumbs ============ */
.breadcrumbs{display:flex;align-items:center;gap:6px;padding:8px 24px 0;font-size:12.5px;color:var(--muted-foreground);min-height:26px}
.breadcrumbs a{color:var(--muted-foreground)}
.breadcrumbs a:hover{color:var(--primary)}
.bcrumb-sep{opacity:.6}
/* ============ Main ============ */
main{flex:1;padding:12px 24px 40px;outline:none}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.page-title{font-size:22px;font-weight:600;letter-spacing:-0.01em}
.page-sub{color:var(--muted-foreground);margin-top:3px;font-size:13.5px;max-width:640px}
.page-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* ============ Buttons ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:8px;font-size:13.5px;font-weight:500;border:1px solid transparent;transition:background .12s,color .12s,border-color .12s;white-space:nowrap}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-primary{background:var(--primary);color:var(--primary-foreground)}
.btn-primary:hover:not(:disabled){background:var(--primary-hover)}
.btn-outline{border-color:var(--border);background:var(--card);color:var(--foreground)}
.btn-outline:hover:not(:disabled){background:var(--muted)}
.btn-ghost{color:var(--muted-foreground)}
.btn-ghost:hover:not(:disabled){background:var(--muted);color:var(--foreground)}
.btn-destructive{background:var(--destructive);color:var(--destructive-foreground)}
.btn-destructive:hover:not(:disabled){filter:brightness(0.92)}
.btn-sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:7px}
.btn-lg{height:40px;padding:0 18px;font-size:14px}
.btn-link{color:var(--primary);padding:0;height:auto}
.btn-link:hover{text-decoration:underline}
/* ============ Forms ============ */
.label{display:block;font-size:13px;font-weight:500;margin-bottom:5px;color:var(--foreground)}
.hint{font-size:12px;color:var(--muted-foreground);margin-top:4px}
.field-error{font-size:12px;color:var(--destructive);margin-top:4px;display:flex;align-items:center;gap:5px}
.input,.select,.textarea{width:100%;height:36px;border:1px solid var(--input);border-radius:8px;background:var(--card);padding:0 11px;font-size:13.5px;color:var(--foreground);outline:none}
.textarea{height:auto;min-height:76px;padding:8px 11px;resize:vertical}
.input:focus,.select:focus,.textarea:focus{border-color:var(--ring);box-shadow:0 0 0 3px var(--skeleton)}
.input[aria-invalid="true"],.textarea[aria-invalid="true"]{border-color:var(--destructive)}
.input:disabled,.select:disabled,.textarea:disabled{opacity:.55;cursor:not-allowed}
.checkbox-row{display:flex;align-items:flex-start;gap:9px;font-size:13px;color:var(--foreground);cursor:pointer}
.checkbox-row input{margin-top:2.5px;accent-color:var(--primary);width:15px;height:15px;flex:none}
.radio-card{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--input);border-radius:10px;padding:11px 12px;cursor:pointer}
.radio-card:hover{border-color:var(--ring)}
.radio-card.checked{border-color:var(--primary);background:var(--primary-soft)}
.radio-card input{margin-top:3px;accent-color:var(--primary);flex:none}
.radio-card b{font-size:13.5px;font-weight:500}
.radio-card p{font-size:12px;color:var(--muted-foreground);margin-top:2px}
.radio-stack{display:flex;flex-direction:column;gap:8px}
.team-chips{display:flex;flex-wrap:wrap;gap:6px}
.team-chip{border:1px solid var(--input);border-radius:99px;padding:5px 12px;font-size:12.5px;background:var(--card)}
.team-chip:hover{border-color:var(--ring)}
.team-chip.on{background:var(--primary);border-color:var(--primary);color:var(--primary-foreground)}
/* ============ Cards ============ */
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-card)}
.card-head{padding:14px 16px;border-bottom:1px solid var(--border)}
.card-head.no-border{border-bottom:0}
.card-body{padding:16px}
.card-foot{padding:12px 16px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card-title{font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.card-desc{font-size:12.5px;color:var(--muted-foreground);margin-top:3px}
.stack{display:flex;flex-direction:column;gap:14px}
/* ============ Chips ============ */
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 9px;font-size:11.5px;font-weight:500;white-space:nowrap}
.chip-progress{background:var(--st-progress-bg);color:var(--st-progress-fg)}
.chip-planning{background:var(--st-planning-bg);color:var(--st-planning-fg)}
.chip-hold{background:var(--st-hold-bg);color:var(--st-hold-fg)}
.chip-done{background:var(--st-done-bg);color:var(--st-done-fg)}
.chip-blocked{background:var(--st-blocked-bg);color:var(--st-blocked-fg)}
.chip-review{background:var(--st-review-bg);color:var(--st-review-fg)}
.chip-neutral{background:var(--st-neutral-bg);color:var(--st-neutral-fg)}
.chip-archived{background:var(--st-neutral-bg);color:var(--st-neutral-fg)}
.chip-primary{background:var(--primary-soft);color:var(--primary)}
/* ============ Tables ============ */
.table-scroll{overflow-x:auto;border-radius:10px}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted-foreground);padding:8px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:var(--muted)}
.tbl .cell-main{display:flex;flex-direction:column;gap:1px;min-width:0}
.tbl .cell-main b{font-size:13px;font-weight:500;color:var(--foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl .cell-main span{font-size:12px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-actions{display:flex;gap:4px;justify-content:flex-end;align-items:center}
.link-btn{color:var(--primary);font-size:12.5px;font-weight:500;padding:4px 6px;border-radius:6px}
.link-btn:hover{background:var(--primary-soft);text-decoration:none}
.link-btn[aria-disabled="true"]{color:var(--muted-foreground);cursor:not-allowed}
.link-btn.danger{color:var(--destructive)}
.link-btn.danger:hover{background:var(--danger-bg)}
/* ============ Segmented ============ */
.seg{display:inline-flex;background:var(--muted);border-radius:10px;padding:3px;gap:2px}
.seg-btn{border-radius:8px;padding:6px 14px;font-size:13px;font-weight:500;color:var(--muted-foreground);display:inline-flex;align-items:center;gap:7px}
.seg-btn:hover{color:var(--foreground)}
.seg-btn[aria-pressed="true"]{background:var(--card);color:var(--foreground);box-shadow:var(--shadow-soft)}
.seg-count{font-size:11px;background:var(--muted);border-radius:99px;padding:1px 7px;color:var(--muted-foreground)}
.seg-btn[aria-pressed="true"] .seg-count{background:var(--primary-soft);color:var(--primary)}
/* ============ Project tab row ============ */
.tabrow{display:flex;gap:2px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:thin;margin:0 -4px;padding:0 4px}
.ptab{position:relative;padding:10px 13px;font-size:13px;color:var(--muted-foreground);border-bottom:2px solid transparent;white-space:nowrap;border-radius:8px 8px 0 0}
.ptab:hover{color:var(--foreground);background:var(--muted)}
.ptab[aria-selected="true"]{color:var(--primary);border-bottom-color:var(--primary);font-weight:500}
.ptab[aria-disabled="true"]{opacity:.45}
.ptab-out:not([aria-selected="true"]){opacity:.5}
.tabpanel{outline:none}
/* ============ Wizard stepper ============ */
.stepper{display:flex;align-items:center;gap:0;padding:4px 0 2px}
.step-item{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.step-item:last-child{flex:0 0 auto}
.step-dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--muted);color:var(--muted-foreground);flex:none}
.step-item.current .step-dot{background:var(--primary);color:var(--primary-foreground)}
.step-item.done .step-dot{background:var(--st-done-bg);color:var(--st-done-fg)}
.step-name{font-size:12.5px;font-weight:500;color:var(--muted-foreground);white-space:nowrap}
.step-item.current .step-name{color:var(--foreground)}
.step-line{height:2px;flex:1;min-width:12px;background:var(--border);margin:0 10px}
.step-item.done .step-line{background:var(--primary)}
/* ============ Dialogs ============ */
.overlay{position:fixed;inset:0;z-index:80;background:oklch(0 0 0 / 0.45);display:flex;align-items:flex-start;justify-content:center;padding:48px 16px 16px;overflow:auto}
.dialog{width:100%;max-width:520px;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-pop);display:flex;flex-direction:column;max-height:calc(100dvh - 64px);animation:pop .14s ease-out}
.dialog.wide{max-width:640px}
.dialog.wizard-dialog{max-width:760px}
.dialog-head{padding:16px 18px 10px;display:flex;gap:12px;align-items:flex-start}
.dialog-title{font-size:15.5px;font-weight:600;flex:1}
.dialog-desc{font-size:13px;color:var(--muted-foreground);margin-top:3px}
.dialog-close{width:28px;height:28px;display:grid;place-items:center;border-radius:7px;color:var(--muted-foreground);flex:none}
.dialog-close:hover{background:var(--muted);color:var(--foreground)}
.dialog-body{padding:6px 18px 14px;overflow:auto}
.dialog-foot{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.dialog-foot .spacer{margin-right:auto}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.985)}to{opacity:1;transform:none}}
/* ============ Toasts ============ */
.toasts{position:fixed;bottom:16px;right:16px;z-index:120;display:flex;flex-direction:column;gap:8px;width:min(360px,calc(100vw - 32px))}
.toast{display:flex;gap:10px;align-items:flex-start;background:var(--popover);color:var(--popover-foreground);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-pop);padding:11px 12px;animation:slidein .18s ease-out}
.toast.out{animation:fadeout .18s ease-in forwards}
@keyframes slidein{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
@keyframes fadeout{to{opacity:0;transform:translateY(4px)}}
.toast-ic{width:18px;height:18px;flex:none;margin-top:1px}
.toast-success .toast-ic{color:var(--st-done-fg)}
.toast-error .toast-ic{color:var(--destructive)}
.toast-info .toast-ic{color:var(--primary)}
.toast-warning{border-color:var(--warn-border)}
.toast-warning .toast-ic{color:var(--warn-fg)}
.toast-body{flex:1;min-width:0}
.toast-title{font-size:13px;font-weight:600}
.toast-desc{font-size:12.5px;color:var(--muted-foreground);margin-top:1px}
.toast-x{color:var(--muted-foreground);width:24px;height:24px;display:grid;place-items:center;border-radius:6px;flex:none}
.toast-x:hover{background:var(--muted)}
/* ============ Banners / helpers ============ */
.banner{display:flex;gap:10px;align-items:flex-start;border:1px solid;border-radius:10px;padding:11px 12px;font-size:13px}
.banner-warn{background:var(--warn-bg);color:var(--warn-fg);border-color:var(--warn-border)}
.banner-danger{background:var(--danger-bg);color:var(--danger-fg);border-color:var(--danger-border)}
.banner-info{background:var(--info-bg);color:var(--info-fg);border-color:var(--info-border)}
.banner .ic{margin-top:1.5px}
.banner b{display:block;font-weight:600}
.banner-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.helper{display:flex;gap:8px;align-items:flex-start;background:var(--info-bg);color:var(--info-fg);border:1px solid var(--info-border);border-radius:10px;padding:10px 12px;font-size:12.5px}
.helper .ic{margin-top:1.5px}
.perm-note{border:1px dashed var(--border);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--muted-foreground);background:var(--muted);display:flex;gap:8px;align-items:flex-start}
.perm-note .ic{margin-top:1px}
/* ============ Empty / error / skeleton ============ */
.empty{padding:34px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.empty-ic{width:40px;height:40px;border-radius:12px;background:var(--muted);display:grid;place-items:center;color:var(--muted-foreground);margin-bottom:4px}
.empty h3{font-size:14px;font-weight:600}
.empty p{font-size:12.5px;color:var(--muted-foreground);max-width:380px}
.skeleton{background:var(--skeleton);border-radius:6px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
/* ============ Steps editor ============ */
.step-row{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--border);border-radius:10px;padding:8px;background:var(--background)}
.step-row.invalid{border-color:var(--destructive)}
.step-num{width:24px;height:24px;flex:none;border-radius:7px;background:var(--muted);display:grid;place-items:center;font-size:11.5px;font-weight:600;color:var(--muted-foreground);margin-top:6px}
.step-inputs{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.step-controls{display:flex;flex-direction:column;gap:2px;flex:none}
.mini-btn{width:26px;height:26px;display:grid;place-items:center;border-radius:6px;color:var(--muted-foreground)}
.mini-btn:hover{background:var(--muted);color:var(--foreground)}
.mini-btn:disabled{opacity:.35;cursor:not-allowed}
.mini-btn.danger:hover{background:var(--danger-bg);color:var(--destructive)}
/* ============ Template picker ============ */
.picker-search{margin-bottom:10px}
.picker-grid{display:grid;grid-template-columns:1fr;gap:8px;max-height:46vh;overflow:auto;padding-right:2px}
@media (min-width:640px){.picker-grid{grid-template-columns:1fr 1fr}}
.picker-card{border:1px solid var(--border);border-radius:11px;padding:12px;cursor:pointer;text-align:left;background:var(--card);display:flex;flex-direction:column;gap:8px}
.picker-card:hover{border-color:var(--primary);box-shadow:var(--shadow-soft)}
.picker-card.selected{border-color:var(--primary);background:var(--primary-soft)}
.picker-card h4{font-size:13.5px;font-weight:600;display:flex;justify-content:space-between;gap:8px;align-items:center}
.picker-card p{font-size:12px;color:var(--muted-foreground);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.picker-meta{display:flex;gap:5px;flex-wrap:wrap}
.picker-foot{font-size:11.5px;color:var(--muted-foreground);display:flex;justify-content:space-between;gap:8px}
/* ============ Review ============ */
.dl{display:flex;flex-direction:column}
.dl-row{display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.dl-row:last-child{border-bottom:0}
.dl-row dt{color:var(--muted-foreground)}
.dl-row dd{text-align:right;font-weight:500;max-width:60%}
.from-tpl-card{border:1px solid var(--ring);background:var(--primary-soft);border-radius:10px;padding:12px}
.from-tpl-card h4{font-size:13px;font-weight:600;display:flex;gap:8px;align-items:center;color:var(--accent-foreground)}
.from-tpl-card p{font-size:12.5px;margin-top:4px}
/* ============ History ============ */
.hist-row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border)}
.hist-row:last-child{border-bottom:0}
.hist-ic{width:30px;height:30px;flex:none;border-radius:8px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center}
.hist-ic.failed{background:var(--danger-bg);color:var(--destructive)}
.hist-body{flex:1;min-width:0}
.hist-body b{font-size:13px;font-weight:500}
.hist-body .sub{font-size:12px;color:var(--muted-foreground);margin-top:1px}
/* ============ Drawer ============ */
.drawer-overlay{position:fixed;inset:0;z-index:85;background:oklch(0 0 0 / 0.4);display:flex;justify-content:flex-end}
.drawer{width:min(460px,100vw);height:100%;background:var(--card);border-left:1px solid var(--border);box-shadow:var(--shadow-pop);display:flex;flex-direction:column;animation:drawerin .18s ease-out}
@keyframes drawerin{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
.drawer-body{flex:1;overflow:auto;padding:14px 18px 24px}
.drawer-body h3{font-size:14px;font-weight:600;margin:16px 0 6px}
.drawer-body p,.drawer-body li{font-size:13px;color:var(--foreground)}
.drawer-body ul{padding-left:18px;margin:4px 0}
.drawer-body li{margin:3px 0}
.drawer-body .muted{font-size:12.5px}
/* ============ Project overview ============ */
.ov-grid{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:900px){.ov-grid{grid-template-columns:1fr 1fr}}
.metric{background:var(--muted);border-radius:10px;padding:12px}
.metric b{font-size:18px;font-weight:600}
.metric span{display:block;font-size:12px;color:var(--muted-foreground)}
.metric-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
/* ============ Two-column ============ */
.cols{display:grid;grid-template-columns:1fr;gap:14px;align-items:start}
@media (min-width:1020px){.cols-2{grid-template-columns:minmax(0,1fr) 340px}}
/* ============ Responsive ============ */
@media (max-width:900px){
  .tenant-name{display:none}
  .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-105%);transition:transform .18s ease;box-shadow:none}
  body.sb-open .sidebar{transform:none;box-shadow:var(--shadow-pop)}
  body.sb-collapsed .sidebar{width:232px}
  body.sb-collapsed .brand-name,body.sb-collapsed .tenant-meta,body.sb-collapsed .user-meta,body.sb-collapsed .side-item span{display:inline}
  body.sb-collapsed .side-item{justify-content:flex-start;padding:7px 10px}
  body.sb-collapsed .tenant-block{justify-content:flex-start;border:1px solid var(--sidebar-border);background:var(--sidebar-accent);padding:7px 8px}
  main{padding:12px 16px 32px}
  .breadcrumbs{padding:8px 16px 0}
}
@media (max-width:560px){
  .hide-sm{display:none}
  .topnav .btn-primary.btn-sm{width:38px;padding:0;gap:0}
  .search-wrap{max-width:none}
  .topnav{gap:6px;padding:0 10px}
  .page-title{font-size:19px}
  .overlay{padding:8px;align-items:flex-end}
  .dialog{max-height:calc(100dvh - 16px);border-radius:14px}
  .dialog.wizard-dialog{max-width:100%}
  .toasts{bottom:10px;right:10px;width:calc(100vw - 20px)}
  .mock-strip{padding:8px 10px}
  .stepper .step-name{display:none}
  .step-item{flex:0 0 auto}
  .step-line{width:18px;min-width:18px;margin:0 6px}
}
@media (max-width:390px){
  main{padding:10px 12px 28px}
  .seg{width:100%}
  .seg-btn{flex:1;justify-content:center}
  .dialog-head,.dialog-body{padding-left:14px;padding-right:14px}
}

  if (!iso) return '—';

  if (isNaN(d.getTime())) return '—';
  var m = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];

function relAgo(iso) {
  if (!iso) return '';
  var d = new Date(iso + 'T00:00:00');
  var now = new Date();
  d.setHours(0, 0, 0, 0);
  now.setHours(0, 0, 0, 0);
  var days = Math.round((now.getTime() - d.getTime()) / 86400000);
  if (days <= 0) return 'today';

function startWorkflow(pr) {
  var wf = getWf(WFS.selectedId);
  if (!wf || WFS.busy) return;
  WFS.busy = true;
  renderPage();
  setTimeout(function () {
    var tasks = wf.steps.map(function (s, i) { return { id: uid('t'), title: s.title }; });
    // Manual recovery: if this template already has a failed start in this project, reconcile that
    // record instead of adding a duplicate start (or counting its tasks twice).
    var failedRow = DB.history.filter(function (h) { return h.projectId === pr.id && h.wfId === wf.id && h.status === 'failed'; })[0];
    var row;
    if (failedRow) {
      failedRow.status = 'started';
      failedRow.tasks = tasks;
      failedRow.startedAt = '2026-11-01';
      failedRow.by = persona().name;
      row = failedRow;
    } else {
      row = { id: uid('h'), projectId: pr.id, wfId: wf.id, wfName: wf.name, startedAt: '2026-11-01', by: persona().name, status: 'started', tasks: tasks };
      DB.history.unshift(row);
    }
    pr.tasks += tasks.length;
    pr.bannerFailures = (pr.bannerFailures || []).filter(function (id) { return id !== wf.id; });
    saveDB();
    WFS = { pid: pr.id, selectedId: '', confirmed: false, busy: false, started: row };
    toast('success', 'Workflow started', tasks.length + ' task' + (tasks.length === 1 ? '' : 's') + ' created from «' + wf.name + '». Task links are in Recent starts.');
    renderPage();
  }, 700);
}
var retryBusy = {};
function retryFailedWorkflow(pr, wfId) {
  var row = DB.history.filter(function (h) { return h.projectId === pr.id && h.wfId === wfId && h.status === 'failed'; })[0];
  var wf = getWf(wfId);
  if (!row || !wf || retryBusy[row.id]) return;
  retryBusy[row.id] = true;
  renderPage();
  setTimeout(function () {
    delete retryBusy[row.id];
    // Idempotency guard: a manual recovery may have reconciled this row while Retry was queued.
    if (!row || row.status !== 'failed') return;
    var tasks = wf.steps.map(function (s, i) { return { id: uid('t'), title: s.title }; });
    row.status = 'started';
    row.tasks = tasks;
    row.startedAt = '2026-11-01';
    row.by = persona().name;
    pr.tasks += tasks.length;
    pr.bannerFailures = (pr.bannerFailures || []).filter(function (id) { return id !== wfId; });
    saveDB();
    toast('success', 'Workflow started', tasks.length + ' task' + (tasks.length === 1 ? '' : 's') + ' created from «' + wf.name + '».');
    renderPage();
  }, 700);
}

      '<div class="helper">' + icon('users', 'ic') + '<span><b>Synthetic data:</b> every project, template, person and number is invented. No real tenant ids, emails, PII or secrets. No backend or network calls; this file works offline.</span></div>' +
      '<div class="helper">' + icon('alert', 'ic') + '<span><b>Simulated paths:</b> loading skeletons, first-run empty states, the template-load error and Retry, and all permission states are driven by the Mock controls strip. <b>Partial failure:</b> when the scenario is on, the next project created from a template fails one workflow start. With two or more active workflows the second fails; with a single workflow it fails. The project is kept, the start is recorded as failed, and Retry or Start from Workflows reconciles that same record without duplicating tasks. The mock strip carries the SIMULATED label; product surfaces show the recovery banner only. No transaction or backend behavior is claimed.</span></div>' +
      '<div class="helper">' + icon('shield', 'ic') + '<span><b>Not claimed (unresolved probes):</b> P-Q3 (creator manager authority on auto-start), P-TX (gateway transaction/atomicity), P-H1–H4 (deployed-bundle drift, viewer-via-workspace start authority), P-MODES (Waterfall/Hybrid status behavior, Teams access mode), P-A11Y (no screen-reader/axe/contrast certification — keyboard, focus and dialog descriptions only), P-MIGRATION (migration numbering/order).</span></div>' +
      '<div class="helper">' + icon('refresh', 'ic') + '<span><b>Reset:</b> the Reset data button clears localStorage/sessionStorage (drafts included) and restores the seed data. Drafts live in sessionStorage, so reloading the page mid-wizard offers Continue draft / Start fresh.</span></div>' +
      '<div class="helper">' + icon('check', 'ic') + '<span><b>Keyboard:</b> project tabs expose selected state, roving tabindex, Arrow keys and Home/End. At narrow widths the sidebar opens as an overlay and Escape closes it, returning focus to the toggle. Dialogs trap focus; Escape closes dialogs and drawers and returns focus. The wizard focuses its first field; the skip link reaches the content.</span></div>' +
      '</div>',
    footer: '<div class="spacer"></div><button class="btn btn-primary" data-notes-close="1">Got it</button>',
    onMount: function (dialog, close) { dialog.querySelector('[data-notes-close]').addEventListener('click', function () { close('ok'); }); }
  });
}
/* ---------- bindings ---------- */
function bindProjectPage(root) {
  var projectTabs = $all('[data-ptab]', root);
  function goToProjectTab(key) {
    if (!key) return;
    if (ROUTE.tab === key) {
      var current = $('.ptab[aria-selected="true"]', root);
      if (current) current.focus();
      return;
    }
    tabFocusPending = true;
    location.hash = '#/projects/' + ROUTE.projectId + '/' + key;
  }
  projectTabs.forEach(function (b, idx) {
    b.addEventListener('click', function () { goToProjectTab(b.getAttribute('data-ptab')); });
    b.addEventListener('keydown', function (e) {
      var next = -1;
      if (e.key === 'ArrowRight') next = (idx + 1) % projectTabs.length;
      else if (e.key === 'ArrowLeft') next = (idx - 1 + projectTabs.length) % projectTabs.length;
      else if (e.key === 'Home') next = 0;
      else if (e.key === 'End') next = projectTabs.length - 1;
      else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); goToProjectTab(b.getAttribute('data-ptab')); return; }
      else return;
      e.preventDefault();
      var target = projectTabs[next];
      projectTabs.forEach(function (t) { t.setAttribute('tabindex', '-1'); });
      target.setAttribute('tabindex', '0');
      target.focus();
      goToProjectTab(target.getAttribute('data-ptab'));
    });
  });
  $all('[data-act="retry"]', root).forEach(function (b) {
    b.addEventListener('click', retryTemplateLoad);
  });
  $all('[data-retry-wf]', root).forEach(function (b) {
    b.addEventListener('click', function () { retryFailedWorkflow(getProject(ROUTE.projectId), b.getAttribute('data-retry-wf')); });
  });
  $all('[data-goto-start]', root).forEach(function (b) {
    b.addEventListener('click', function () {
      var wfId = b.getAttribute('data-goto-start');
      WFS = { pid: ROUTE.projectId, selectedId: wfId, confirmed: false, busy: false, started: null };
      if (ROUTE.tab === 'workflows') { renderPage(); }
      else { location.hash = '#/projects/' + ROUTE.projectId + '/workflows'; }
    });
  });
  $all('[data-goto]', root).forEach(function (b) {
    b.addEventListener('click', function () { location.hash = '#/projects/' + ROUTE.projectId + '/' + b.getAttribute('data-goto'); });
  });
  $all('[data-invite]', root).forEach(function (b) {
    b.addEventListener('click', function () { toast('info', 'Invite collaborators', 'This isn\'t available in this preview.'); });
  });
  $all('[data-help]', root).forEach(function (b) {
    b.addEventListener('click', function (e) { e.preventDefault(); openHelp(b.getAttribute('data-help')); });
  });
  $all('[data-wf-new]', root).forEach(function (b) { b.addEventListener('click', function () { openWorkflowTemplateForm(null); }); });
  $all('[data-wf-edit]', root).forEach(function (b) { b.addEventListener('click', function () { openWorkflowTemplateForm(getWf(b.getAttribute('data-wf-edit'))); }); });
  $all('[data-wf-archive]', root).forEach(function (b) {
    b.addEventListener('click', function () {
      var w = getWf(b.getAttribute('data-wf-archive'));
      confirmDialog({
        title: 'Archive workflow template?',
        description: '«' + w.name + '» can\'t be started in any project and is hidden from start pickers. Existing projects and tasks are not affected. You can restore it anytime.',
        confirmLabel: 'Archive', destructive: true,
        onConfirm: function () {
          w.status = 'archived';
          if (WFS && WFS.selectedId === w.id) WFS.selectedId = '';
          saveDB();
          renderPage();
          toast('success', 'Workflow template archived', '«' + w.name + '» is hidden from start pickers.');
        }
      });
    });
  });
  $all('[data-wf-restore]', root).forEach(function (b) {
    b.addEventListener('click', function () {
      var w = getWf(b.getAttribute('data-wf-restore'));
      confirmDialog({
        title: 'Restore workflow template?',
        description: '«' + w.name + '» will be available to start again in every project.',
        confirmLabel: 'Restore',
        onConfirm: function () {
          w.status = 'active';
          saveDB();
          renderPage();
          toast('success', 'Workflow template restored', '«' + w.name + '» is available to start again.');
        }
      });
    });
  });
  bindWfForm(root);
  var sel = $('#wfs-select', root);
  if (sel) sel.addEventListener('change', function () {
    WFS.selectedId = sel.value;
    WFS.confirmed = false;
    WFS.started = null;
    renderPage();
  });
  var conf = $('#wfs-confirm', root);
  if (conf) conf.addEventListener('change', function () { WFS.confirmed = conf.checked; renderPage(); });
  var startBtn = $('[data-wfs-start]', root);
  if (startBtn) startBtn.addEventListener('click', function () { startWorkflow(getProject(ROUTE.projectId)); });
  $all('[data-view-tasks]', root).forEach(function (b) {
    b.addEventListener('click', function () {
      var row = DB.history.filter(function (h) { return h.id === b.getAttribute('data-view-tasks'); })[0];
      if (row) openTaskList(row);
    });
  });
  $all('[data-hist-retry]', root).forEach(function (b) {
    b.addEventListener('click', function () {
      var row = DB.history.filter(function (h) { return h.id === b.getAttribute('data-hist-retry'); })[0];
      if (row) retryFailedWorkflow(getProject(ROUTE.projectId), row.wfId);
    });
  });
  var nameIn = $('#st-name', root);
  if (nameIn) nameIn.addEventListener('input', function () { SETTINGS.name = nameIn.value; });
  var descIn = $('#st-desc', root);
  if (descIn) descIn.addEventListener('input', function () { SETTINGS.desc = descIn.value; });
  $all('input[name="st-visibility"]', root).forEach(function (r) {
    r.addEventListener('change', function () { SETTINGS.visibility = r.value; renderPage(); });
  });
  $all('[data-st-team]', root).forEach(function (b) {
    b.addEventListener('click', function () {
      var id = b.getAttribute('data-st-team');
      var i = SETTINGS.teamIds.indexOf(id);
      if (i > -1) SETTINGS.teamIds.splice(i, 1); else SETTINGS.teamIds.push(id);
      renderPage();
    });
  });
  var methSel = $('#st-methodology', root);
  if (methSel) methSel.addEventListener('change', function () { SETTINGS.methodology = methSel.value; });
  $all('[data-st-save]', root).forEach(function (b) {
    b.addEventListener('click', function () { stSave(getProject(ROUTE.projectId), b.getAttribute('data-st-save')); });
  });
  $all('[data-save-as-tpl]', root).forEach(function (b) {
    b.addEventListener('click', function () {
      var pr = getProject(ROUTE.projectId);
      var tpl = {
        name: pr.name + ' template', desc: pr.desc,
        visibility: pr.visibility === 'teams' ? 'private' : pr.visibility,
        methodology: pr.methodology, wfIds: []
      };
      openProjectTemplateDialog(null, tpl, pr);
    });
  });
}
/* ---------- init ---------- */
function init() {
  bindShell();
  renderPage();
}
init();

</script>
