<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light dark" />
<title>WayPoint — Direction A mockup: template-first hub (workflows & project templates)</title>
<style>
/* ============ tokens (mirrors WayPoint published mocks) ============ */
:root{
  --radius:.75rem;
  --background:#f7f8fb;
  --foreground:#202a3d;
  --card:#ffffff;
  --card-foreground:#202a3d;
  --primary:#4f46e5;
  --primary-foreground:#fafaff;
  --secondary:#f1f2f6;
  --secondary-foreground:#253045;
  --muted:#f4f5f8;
  --muted-foreground:#5b6b85;
  --accent:#eef2ff;
  --accent-foreground:#3730a3;
  --destructive:#dc2626;
  --destructive-foreground:#fef2f2;
  --border:#e3e6ee;
  --input:#e3e6ee;
  --ring:#4f46e5;
  --sidebar:#fbfbfd;
  --sidebar-foreground:#2b3648;
  --sidebar-border:#e3e6ee;
  --sidebar-accent:#eef2ff;
  --sidebar-accent-foreground:#3730a3;
  --ok:#16a34a; --ok-bg:#ecfdf5;
  --warn:#b45309; --warn-bg:#fffbeb;
  --info:#1d4ed8; --info-bg:#eff6ff;
  --danger:#b91c1c; --danger-bg:#fef2f2;
  --shadow-soft:0 1px 2px 0 rgba(32,42,61,.05);
  --shadow-card:0 1px 3px 0 rgba(32,42,61,.07),0 1px 2px -1px rgba(32,42,61,.05);
  --font:ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
.dark{
  color-scheme:dark;
  --background:#10131c;
  --foreground:#f4f6fb;
  --card:#1b2030;
  --card-foreground:#f4f6fb;
  --primary:#818cf8;
  --primary-foreground:#12132b;
  --secondary:#242a3d;
  --secondary-foreground:#f4f6fb;
  --muted:#222839;
  --muted-foreground:#9aa6bd;
  --accent:#2a3150;
  --accent-foreground:#e4e6ff;
  --destructive:#f87171;
  --destructive-foreground:#2b1212;
  --border:rgba(255,255,255,.12);
  --input:rgba(255,255,255,.16);
  --ring:#818cf8;
  --sidebar:#171c2a;
  --sidebar-foreground:#e8ecf6;
  --sidebar-border:rgba(255,255,255,.12);
  --sidebar-accent:#2a3150;
  --sidebar-accent-foreground:#e4e6ff;
  --ok:#4ade80; --ok-bg:rgba(34,197,94,.12);
  --warn:#fbbf24; --warn-bg:rgba(245,158,11,.12);
  --info:#93c5fd; --info-bg:rgba(59,130,246,.12);
  --danger:#fca5a5; --danger-bg:rgba(239,68,68,.12);
  --shadow-soft:0 1px 2px 0 rgba(0,0,0,.3);
  --shadow-card:0 1px 3px 0 rgba(0,0,0,.35),0 1px 2px -1px rgba(0,0,0,.3);
}
/* ============ base ============ */
*,*:before,*:after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--background);color:var(--foreground);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
img,svg{display:block}
a{color:inherit}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:4px}
.skip-link{position:fixed;left:-9999px;top:0;z-index:200;background:var(--card);color:var(--foreground);padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-weight:600;text-decoration:none}
.skip-link:focus{left:12px;top:12px}
.icon{width:16px;height:16px;flex:none}
.icon-lg{width:20px;height:20px}
.icon-sm{width:14px;height:14px}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
/* ============ app layout ============ */
.app{display:flex;min-height:100vh}
.sidebar{width:248px;flex:none;background:var(--sidebar);border-right:1px solid var(--sidebar-border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:40}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 14px}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--primary);color:var(--primary-foreground);display:grid;place-items:center;font-weight:700;font-size:15px}
.brand-name{font-weight:650;font-size:15px;letter-spacing:-.01em}
.nav{padding:4px 10px;display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--sidebar-foreground);text-decoration:none;position:relative}
.nav-item:hover{background:var(--sidebar-accent);color:var(--sidebar-accent-foreground)}
.nav-item[aria-current="page"]{background:var(--sidebar-accent);color:var(--sidebar-accent-foreground);font-weight:600}
.nav-item .new-badge{font-size:10px;font-weight:700;letter-spacing:.03em;background:var(--primary);color:var(--primary-foreground);padding:2px 6px;border-radius:999px;margin-left:auto;text-transform:uppercase}
.nav-section{margin:12px 16px 4px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground)}
.sidebar-foot{margin-top:auto;padding:14px 16px;border-top:1px solid var(--sidebar-border);font-size:12px;color:var(--muted-foreground);display:flex;flex-direction:column;gap:8px}
.persona-chip{display:flex;align-items:center;gap:8px}
.avatar{width:26px;height:26px;border-radius:999px;background:var(--secondary);color:var(--secondary-foreground);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:54px;flex:none;display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(8px);position:sticky;top:0;z-index:35}
.searchbox{flex:1;max-width:420px;display:flex;align-items:center;gap:8px;border:1px solid var(--input);background:var(--card);border-radius:9px;padding:0 10px;height:34px;color:var(--muted-foreground)}
.searchbox input{border:none;background:none;outline:none;flex:1;min-width:0;font-size:13.5px;color:var(--foreground)}
.icon-btn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--muted-foreground)}
.icon-btn:hover{background:var(--muted);color:var(--foreground)}
.hamburger{display:none}
.demo-strip{flex:none;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--accent) 55%,var(--card));padding:7px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px}
.demo-strip .lbl{font-weight:650;color:var(--accent-foreground);display:flex;align-items:center;gap:6px}
.demo-strip .hint{color:var(--muted-foreground)}
.demo-strip select{height:28px;border:1px solid var(--input);border-radius:7px;background:var(--card);padding:0 8px;font-size:12px;max-width:190px}
.content{padding:22px 26px 60px;max-width:1240px;width:100%;margin:0 auto}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.page-head h1{font-size:22px;font-weight:650;letter-spacing:-.02em}
.page-head .sub{color:var(--muted-foreground);font-size:13.5px;margin-top:2px;max-width:760px}
.page-head .actions{display:flex;gap:8px;flex-wrap:wrap}
/* ============ buttons ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:9px;font-size:13.5px;font-weight:550;border:1px solid transparent;transition:background .12s,border-color .12s;white-space:nowrap}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-primary{background:var(--primary);color:var(--primary-foreground)}
.btn-primary:hover:not(:disabled){background:color-mix(in srgb,var(--primary) 88%,black)}
.btn-outline{border-color:var(--input);background:var(--card);color:var(--foreground)}
.btn-outline:hover:not(:disabled){background:var(--muted)}
.btn-ghost{color:var(--muted-foreground)}
.btn-ghost:hover:not(:disabled){background:var(--muted);color:var(--foreground)}
.btn-danger{background:var(--destructive);color:var(--destructive-foreground)}
.btn-danger:hover:not(:disabled){background:color-mix(in srgb,var(--destructive) 88%,black)}
.btn-sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn-lg{height:40px;padding:0 18px;font-size:14px}
.btn .icon{width:15px;height:15px}
/* ============ forms ============ */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field label{font-size:12.5px;font-weight:600;color:var(--foreground)}
.field .req{color:var(--destructive)}
.field .help{font-size:12px;color:var(--muted-foreground)}
.field .err{font-size:12px;color:var(--destructive);font-weight:500}
.input,.select,.textarea{width:100%;border:1px solid var(--input);border-radius:9px;background:var(--card);color:var(--foreground);padding:8px 11px;font-size:13.5px}
.input:focus,.select:focus,.textarea:focus{outline:2px solid var(--ring);outline-offset:0;border-color:transparent}
.input[aria-invalid="true"],.select[aria-invalid="true"],.textarea[aria-invalid="true"]{border-color:var(--destructive)}
.input[disabled],.select[disabled],.textarea[disabled]{opacity:.55;cursor:not-allowed}
.textarea{min-height:72px;resize:vertical}
.charcount{font-size:11px;color:var(--muted-foreground);text-align:right}
.charcount.over{color:var(--destructive);font-weight:600}
.radiocard{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--input);border-radius:10px;padding:12px 14px;cursor:pointer;background:var(--card)}
.radiocard:hover{border-color:var(--ring)}
.radiocard.selected{border-color:var(--ring);background:var(--accent)}
.radiocard input{margin-top:3px;accent-color:var(--primary)}
.radiocard .rc-title{display:block;font-weight:600;font-size:13.5px}
.radiocard .rc-desc{display:block;font-size:12.5px;color:var(--muted-foreground);margin-top:2px}
.radiocard>span:last-child,.checkrow>span:last-child{display:block;min-width:0}
.checkrow{display:flex;gap:10px;align-items:flex-start;padding:9px 0}
.checkrow input{margin-top:3px;accent-color:var(--primary)}
.checkrow .cr-title{display:block;font-weight:550;font-size:13.5px}
.checkrow .cr-desc{display:block;font-size:12px;color:var(--muted-foreground);margin-top:2px}
/* ============ cards & layout helpers ============ */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-soft)}
.card-pad{padding:16px}
.card-title{font-size:14.5px;font-weight:650;display:flex;align-items:center;gap:8px}
.card-sub{font-size:12.5px;color:var(--muted-foreground);margin-top:2px}
.row{display:flex;gap:10px;align-items:center}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stack{display:flex;flex-direction:column;gap:10px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}
.muted{color:var(--muted-foreground)}
.small{font-size:12.5px}
.tiny{font-size:11.5px}
.bold{font-weight:600}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
hr.sep{border:none;border-top:1px solid var(--border);margin:14px 0}
/* ============ chips ============ */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2.5px 9px;border-radius:999px;border:1px solid transparent;white-space:nowrap}
.chip .icon{width:12px;height:12px}
.chip-status{background:var(--info-bg);color:var(--info)}
.chip-planning{background:var(--warn-bg);color:var(--warn)}
.chip-progress{background:var(--info-bg);color:var(--info)}
.chip-hold{background:var(--danger-bg);color:var(--danger)}
.chip-done{background:var(--ok-bg);color:var(--ok)}
.chip-archived{background:var(--muted);color:var(--muted-foreground)}
.chip-vis{background:var(--secondary);color:var(--secondary-foreground)}
.chip-method{background:var(--accent);color:var(--accent-foreground)}
.chip-new{background:var(--primary);color:var(--primary-foreground)}
/* ============ tables ============ */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--card);box-shadow:var(--shadow-soft)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
.tbl th{text-align:left;font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted-foreground);padding:9px 12px;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--muted) 60%,transparent)}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr:hover{background:color-mix(in srgb,var(--muted) 55%,transparent)}
.tbl .cell-main{min-width:180px}
.tbl .cell-main .t{font-weight:600;font-size:13px}
.tbl .cell-main .d{font-size:12px;color:var(--muted-foreground);margin-top:1px;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl .acts{display:flex;gap:4px;justify-content:flex-end}
/* ============ banners / states ============ */
.banner{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--border);border-radius:11px;padding:12px 14px;background:var(--card);font-size:13px}
.banner .b-title{font-weight:650;font-size:13.5px}
.banner .b-body{color:var(--muted-foreground);margin-top:1px;font-size:12.5px}
.banner .b-acts{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.banner-info{border-color:color-mix(in srgb,var(--info) 30%,var(--border));background:var(--info-bg)}
.banner-info .b-title{color:var(--info)}
.banner-warning{border-color:color-mix(in srgb,var(--warn) 30%,var(--border));background:var(--warn-bg)}
.banner-warning .b-title{color:var(--warn)}
.banner-danger{border-color:color-mix(in srgb,var(--danger) 30%,var(--border));background:var(--danger-bg)}
.banner-danger .b-title{color:var(--danger)}
.banner-muted{background:var(--muted)}
.sim-tag{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:750;letter-spacing:.05em;text-transform:uppercase;color:var(--warn);border:1px dashed color-mix(in srgb,var(--warn) 55%,transparent);border-radius:6px;padding:1.5px 7px}
.statebox{border:1px dashed var(--input);border-radius:var(--radius);background:color-mix(in srgb,var(--muted) 50%,transparent);padding:34px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.statebox .st-title{font-weight:650;font-size:14.5px}
.statebox .st-body{font-size:13px;color:var(--muted-foreground);max-width:460px}
.statebox .icon-big{width:38px;height:38px;color:var(--muted-foreground);opacity:.7}
.skeleton{background:linear-gradient(90deg,var(--muted) 25%,color-mix(in srgb,var(--muted) 45%,var(--card)) 37%,var(--muted) 63%);background-size:400% 100%;animation:skel 1.3s ease infinite;border-radius:7px}
@keyframes skel{0%{background-position:100% 50%}100%{background-position:0 50%}}
/* ============ tabs & segmented ============ */
.tabrow{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--border);margin-bottom:16px;scrollbar-width:none}
.tabrow::-webkit-scrollbar{display:none}
.tab{padding:9px 13px;font-size:13px;font-weight:550;color:var(--muted-foreground);border-bottom:2px solid transparent;white-space:nowrap;display:inline-flex;gap:7px;align-items:center}
.tab:hover{color:var(--foreground)}
.tab[aria-selected="true"]{color:var(--foreground);border-bottom-color:var(--primary);font-weight:650}
.tab:disabled{opacity:.45;cursor:not-allowed}
.tab .tab-note{font-size:10px;color:var(--muted-foreground);font-weight:600}
.segmented{display:inline-flex;background:var(--muted);border-radius:10px;padding:3px;gap:2px}
.seg{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:8px;font-size:13px;font-weight:550;color:var(--muted-foreground)}
.seg[aria-selected="true"]{background:var(--card);color:var(--foreground);box-shadow:var(--shadow-soft);font-weight:650}
/* ============ wizard ============ */
.overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--background) 82%,transparent);backdrop-filter:blur(3px);z-index:60;overflow-y:auto;display:flex;align-items:flex-start;justify-content:center;padding:28px 16px}
.wizard{width:100%;max-width:760px;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-card)}
.wizard-head{padding:18px 22px 0;display:flex;align-items:center;justify-content:space-between;gap:10px}
.wizard-head .w-title{font-size:17px;font-weight:650}
.wizard-head .w-sub{font-size:13px;color:var(--muted-foreground);margin-top:2px}
.steps{display:flex;align-items:center;padding:16px 22px 6px;overflow-x:auto}
.step{display:flex;align-items:center;gap:8px;color:var(--muted-foreground);flex:none}
.step .dot{width:26px;height:26px;border-radius:999px;border:1.5px solid var(--input);display:grid;place-items:center;font-size:12px;font-weight:650;background:var(--card);color:var(--muted-foreground)}
.step[aria-current="step"] .dot{background:var(--primary);border-color:var(--primary);color:var(--primary-foreground)}
.step.done .dot{background:var(--accent);border-color:var(--primary);color:var(--primary)}
.step .slabel{font-size:12.5px;font-weight:550}
.step[aria-current="step"] .slabel{color:var(--foreground);font-weight:650}
.step .sindex{font-size:12px;font-weight:650}
.conn{width:26px;height:1.5px;background:var(--input);margin:0 8px;flex:none}
.conn.done{background:var(--primary)}
.wizard-body{padding:18px 22px;max-height:min(58vh,620px);overflow-y:auto}
.wizard-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}
.wizard-foot .spacer{flex:1}
.entrycards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.entrycard{border:1.5px solid var(--input);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;cursor:pointer;background:var(--card);text-align:left}
.entrycard:hover{border-color:var(--ring);box-shadow:var(--shadow-card)}
.entrycard .ec-title{font-weight:650;font-size:14.5px;display:flex;align-items:center;gap:8px}
.entrycard .ec-desc{font-size:12.5px;color:var(--muted-foreground)}
.entrycard .ec-meta{font-size:11.5px;color:var(--muted-foreground);border-top:1px solid var(--border);margin-top:6px;padding-top:8px;display:flex;flex-direction:column;gap:3px}
.reviewrow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
.reviewrow:last-child{border-bottom:none}
.reviewrow .rk{color:var(--muted-foreground);display:flex;align-items:center;gap:6px;flex:none}
.reviewrow .rv{font-weight:550;text-align:right;min-width:0;overflow-wrap:anywhere}
/* ============ dialogs ============ */
.dlg-overlay{position:fixed;inset:0;background:rgba(10,14,26,.55);z-index:80;display:flex;align-items:center;justify-content:center;padding:18px}
.dlg-overlay.dlg-top{z-index:100}
.dlg{width:100%;max-width:470px;max-height:calc(100vh - 40px);overflow:hidden;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-card)}
.dlg-wide{max-width:680px}
.dlg-head{padding:16px 18px 0;flex:none}
.dlg-title{font-size:15.5px;font-weight:650}
.dlg-desc{font-size:13px;color:var(--muted-foreground);margin-top:5px}
.dlg-body{padding:12px 18px;flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.dlg-foot{padding:14px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:9px;flex-wrap:wrap;flex:none;background:var(--card);border-radius:0 0 14px 14px}
/* ============ toasts ============ */
.toast-root{position:fixed;bottom:18px;right:18px;z-index:120;display:flex;flex-direction:column;gap:9px;max-width:min(390px,calc(100vw - 32px))}
.toast{display:flex;gap:10px;align-items:flex-start;background:var(--foreground);color:var(--background);border-radius:11px;padding:11px 14px;box-shadow:var(--shadow-card);font-size:13px;animation:toastin .18s ease-out}
@keyframes toastin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.toast .t-ico{color:var(--ok);margin-top:1px}
.toast .t-close{margin-left:auto;opacity:.7;display:grid;place-items:center;flex:none}
.toast .t-close:hover{opacity:1}
/* ============ steps preview / workflow ============ */
.stepprev{display:flex;flex-direction:column;gap:0;margin-top:6px}
.stepprev .sp{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--border);font-size:13px}
.stepprev .sp:last-child{border-bottom:none}
.stepprev .sp .num{width:22px;height:22px;border-radius:999px;background:var(--accent);color:var(--accent-foreground);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.stepprev .sp .note{font-size:12px;color:var(--muted-foreground)}
/* step editor rows */
.steprow{display:flex;gap:8px;align-items:flex-start;padding:8px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;background:color-mix(in srgb,var(--muted) 40%,transparent)}
.steprow .num{width:22px;height:22px;border-radius:999px;background:var(--accent);color:var(--accent-foreground);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none;margin-top:6px}
.steprow .fields{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.steprow .rowtools{display:flex;flex-direction:column;gap:2px}
.mini-btn{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--muted-foreground)}
.mini-btn:hover{background:var(--muted);color:var(--foreground)}
.mini-btn:disabled{opacity:.35;cursor:not-allowed}
.mini-btn.danger:hover{color:var(--destructive)}
/* ============ picker cards ============ */
.pickgrid{display:grid;grid-template-columns:1fr;gap:10px}
.pickcard{border:1.5px solid var(--input);border-radius:12px;padding:13px 15px;display:flex;flex-direction:column;gap:7px;cursor:pointer;background:var(--card);text-align:left}
.pickcard:hover{border-color:var(--ring)}
.pickcard.selected{border-color:var(--ring);background:var(--accent)}
.pickcard .pc-title{font-weight:650;font-size:14px}
.pickcard .pc-desc{font-size:12.5px;color:var(--muted-foreground)}
.pickcard .pc-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:11.5px;color:var(--muted-foreground)}
/* ============ help drawer / notes ============ */
.drawer-overlay{position:fixed;inset:0;background:rgba(10,14,26,.45);z-index:90}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:var(--card);border-left:1px solid var(--border);z-index:95;overflow-y:auto;box-shadow:var(--shadow-card);padding:20px 22px 40px}
.drawer h2{font-size:16px;font-weight:650;margin-bottom:4px}
.drawer h3{font-size:13px;font-weight:650;margin:18px 0 6px;display:flex;align-items:center;gap:7px}
.drawer p,.drawer li{font-size:12.5px;color:var(--muted-foreground)}
.drawer ul{padding-left:18px;display:flex;flex-direction:column;gap:5px;margin-top:4px}
.drawer code{font-size:11.5px;background:var(--muted);padding:1px 5px;border-radius:5px}
.kbd{font-size:10.5px;font-weight:650;border:1px solid var(--input);border-bottom-width:2px;border-radius:5px;padding:1px 5px;background:var(--muted)}
.probe-list li b{color:var(--foreground)}
/* ============ responsive ============ */
.scrim{position:fixed;inset:0;background:rgba(10,14,26,.45);z-index:39;display:none}
@media (max-width:980px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-105%);transition:transform .18s ease;z-index:45}
  .sidebar.open{transform:none;box-shadow:var(--shadow-card)}
  .scrim.show{display:block}
  .hamburger{display:grid}
  .entrycards{grid-template-columns:1fr}
}
@media (max-width:640px){
  .content{padding:14px 12px 48px}
  .topbar{padding:0 10px;gap:6px}
  .searchbox{max-width:none}
  .grid2{grid-template-columns:1fr}
  .wizard-foot{flex-wrap:wrap}
  .wizard-foot .btn{flex:1;min-width:110px}
  .step .slabel{display:none}
  .conn{width:14px;margin:0 5px}
  .page-head h1{font-size:19px}
  .toast-root{left:16px;right:16px;bottom:14px}
  .demo-strip{padding:7px 10px;gap:6px}
}
@media (max-width:390px){
  .btn{padding:0 11px}
  .page-head .actions .btn{flex:1}
  .radiocard{padding:10px 12px}
  .dlg-foot .btn{flex:1}
}

function filtered(list, q){

  var id = "toast-" + (++S.toastSeq || (S.toastSeq = 1));
  S.toasts.push({ id:id, msg:msg, kind:kind || "ok" });

function doCreate(){
  var w = S.wizard;

  var project = {
    id: pid, name: w.f.name.trim(), desc: w.f.desc.trim(), vis: w.f.vis, method: w.f.method,
    status: "planning", due: w.f.due || null, extra: 0, updated: "Just now", fromTemplate: w.templateId || null
  };
  var starts = [], failed = null, tasksCreated = 0, startedCount = 0;
  if (w.templateId){
    var t = ptById(w.templateId);
    if (t && t.status === "active"){
      var ids = [];
      for (var i=0;i<t.wfIds.length;i++){ var wt = wfById(t.wfIds[i]); if (wt && wt.status === "active") ids.push(wt.id); }
      if (S.scenario === "partial" && ids.length >= 2){ failed = ids[ids.length-1]; ids = ids.slice(0, ids.length-1); }
      for (var j=0;j<ids.length;j++){
        var wf = wfById(ids[j]);
        var tasks = [];
        for (var k=0;k<wf.steps.length;k++) tasks.push({ id: "t" + pid + "-" + j + "-" + k, title: wf.steps[k].t, status: "todo" });
        starts.push({ id: "s" + pid + "-" + j, wfId: wf.id, date: "Nov 1, 2026", tasks: tasks });
        tasksCreated += tasks.length; startedCount++;

    }

  if (failed){ S.partialFails[pid] = failed; }

    showToast("Project created.", "ok", "create-plain");
  }
  S.focusReq = '[data-tid="banner-partial"] a, [data-tid="banner-partial"] button, [data-tid="proj-title"]';
  render();

function edSave(){
  var e = S.editor; if (!e || S.busy) return;
  e.errors = {};
  var name = e.f.name.trim();
  if (!name){ e.errors.name = "Name is required."; }
  else if (name.length > 80){ e.errors.name = "Keep it under 80 characters."; }
  if (e.errors.name){
    S.focusReq = '[data-tid="ed-name"]';
    renderOverlays();
    return;
  }
  if (e.kind === "wf"){
    var bad = {}, firstBad = -1;
    for (var i=0;i<e.f.steps.length;i++){
      if (!e.f.steps[i].t.trim()){ bad[i] = "Step title can't be empty."; if (firstBad < 0) firstBad = i; }
    }
    if (firstBad >= 0){
      e.errors.steps = bad;
      e.errors.stepSummary = "Some steps need a title. Add a title to each highlighted step.";
      S.focusReq = '[data-tid="ed-step-t-' + firstBad + '"]';
      renderOverlays();
      return;
    }
  }
  S.busy = "ed-save";
  renderOverlays();
  window.setTimeout(function(){
    S.busy = null;
    var rf = e.returnFocus;
    if (e.kind === "pt"){
      var cleanWfIds = [];
      for (var wq=0; wq<e.f.wfIds.length; wq++){ var wref = e.f.wfIds[wq]; if (wfById(wref) && cleanWfIds.indexOf(wref) < 0) cleanWfIds.push(wref); }
      if (e.mode === "edit" && e.id){
        // Preserve identity/provenance: mutate the existing record in place instead of replacing it.
        var cur = null;
        for (var k=0;k<S.ptTemplates.length;k++){ if (S.ptTemplates[k].id === e.id){ cur = S.ptTemplates[k]; break; } }
        if (cur){
          cur.name = name; cur.desc = e.f.desc.trim(); cur.vis = e.f.vis; cur.method = e.f.method;
          cur.wfIds = cleanWfIds.slice(); cur.updated = "Just now"; cur.by = PERSONS[S.persona].name;
        } else {
          S.ptTemplates.unshift({ id: e.id, name: name, desc: e.f.desc.trim(), vis: e.f.vis, method: e.f.method, wfIds: cleanWfIds.slice(), status: "active", updated: "Just now", by: PERSONS[S.persona].name });
        }
        showToast("Project template saved.", "ok", "pt-saved");
      } else {
        S.ptTemplates.unshift({ id: "pt" + Date.now(), name: name, desc: e.f.desc.trim(), vis: e.f.vis, method: e.f.method, wfIds: cleanWfIds.slice(), status: "active", updated: "Just now", by: PERSONS[S.persona].name });
        showToast("Project template created.", "ok", "pt-created");
      }
    } else {
      var steps = e.f.steps.map(function(s){ return { t: s.t.trim(), n: s.n.trim() }; });
      if (e.mode === "edit" && e.id){
        // Same identity preservation for workflow templates: id and status stay stable.
        var wcur = null;
        for (var m=0;m<S.wfTemplates.length;m++){ if (S.wfTemplates[m].id === e.id){ wcur = S.wfTemplates[m]; break; } }
        if (wcur){
          wcur.name = name; wcur.desc = e.f.desc.trim(); wcur.steps = steps;
          wcur.updated = "Just now"; wcur.by = PERSONS[S.persona].name;
        } else {
          S.wfTemplates.unshift({ id: e.id, name: name, desc: e.f.desc.trim(), steps: steps, status: "active", updated: "Just now", by: PERSONS[S.persona].name });
        }
        showToast("Workflow template saved.", "ok", "wf-saved");
      } else {
        S.wfTemplates.unshift({ id: "wf" + Date.now(), name: name, desc: e.f.desc.trim(), steps: steps, status: "active", updated: "Just now", by: PERSONS[S.persona].name });
        showToast("Workflow template created.", "ok", "wf-created");
      }
    }
    S.editor = null;
    save();
    render();
    focusOrMain(rf);
  }, 650);
}

function doStartWorkflow(){
  var p = projById(S.projId);
  var wf = wfById(S.startSel);
  if (!p || !wf || !S.startConfirm || S.busy) return;
  // Starting the failed workflow manually is itself a recovery: reconcile the banner after the start.
  var recovering = S.partialFails[S.projId] === wf.id;
  S.busy = "start";
  render();
  window.setTimeout(function(){
    S.busy = null;
    var tasks = [];
    for (var i=0;i<wf.steps.length;i++) tasks.push({ id: "t" + Date.now() + "-" + i, title: wf.steps[i].t, status: "todo" });
    var st = { id: "s" + Date.now(), wfId: wf.id, date: "Nov 1, 2026", tasks: tasks };
    S.starts[S.projId] = [st].concat(S.starts[S.projId] || []);
    if (recovering) delete S.partialFails[S.projId];
    S.startSel = null; S.startConfirm = false;
    save();
    var msg = "Workflow started · " + tasks.length + " task" + (tasks.length===1?"":"s") + " created.";
    if (recovering) msg += " Failure reconciled.";
    showToast(msg, "ok", "start-toast");
    S.focusReq = '[data-tid="history-row-0"] button';
    render();
  }, 600);
}
function retryPartial(){
  var pid = S.projId;
  var wfId = S.partialFails[pid];
  if (!wfId || S.busy) return;
  var wf = wfById(wfId);
  // Idempotency guard: a retry never creates the same workflow's tasks twice.
  var already = false, existing = S.starts[pid] || [];
  for (var a=0;a<existing.length;a++){ if (existing[a].wfId === wfId){ already = true; break; } }
  if (!wf || already){
    delete S.partialFails[pid];
    save();
    render();
    showToast(already ? "That workflow is already started — no duplicate tasks were created." : "Nothing left to retry — the failure was already reconciled.", "info", "retry-noop");
    focusOrMain(S.tab === "workflows" && already ? '[data-tid="history-row-0"] button' : '[data-tid="tab-workflows"]');
    return;
  }
  S.busy = "retry";
  render();
  window.setTimeout(function(){
    S.busy = null;
    var tasks = [];
    for (var i=0;i<wf.steps.length;i++) tasks.push({ id: "t" + Date.now() + "-r" + i, title: wf.steps[i].t, status: "todo" });
    S.starts[pid] = [{ id: "s" + Date.now(), wfId: wf.id, date: "Nov 1, 2026", tasks: tasks }].concat(S.starts[pid] || []);
    delete S.partialFails[pid];
    save();
    showToast("Workflow started · " + tasks.length + " task" + (tasks.length===1?"":"s") + " created. Failure reconciled.", "ok", "retry-toast");
    render();
    focusOrMain(S.tab === "workflows" ? '[data-tid="history-row-0"] button' : '[data-tid="tab-workflows"]');
  }, 600);
}

    if (fs.length === 0) return;
    var first = fs[0], last = fs[fs.length-1];
    if (ev.shiftKey && document.activeElement === first){ ev.preventDefault(); last.focus(); }
    else if (!ev.shiftKey && document.activeElement === last){ ev.preventDefault(); first.focus(); }
    else if (!container.contains(document.activeElement)){ ev.preventDefault(); first.focus(); }
    return;
  }
  if ((ev.key === "Enter" || ev.key === " ") && !container){
    var el = ev.target && ev.target.closest ? ev.target.closest('[role="button"][data-act], [role="radio"][data-act]') : null;
    if (el && ev.target === el){ ev.preventDefault(); el.click(); }
  }
}
function closeSidebar(){
  var sb = document.getElementById("sidebar");
  if (sb){ sb.classList.remove("open"); }
  var sc = document.getElementById("scrim");
  if (sc){ sc.classList.remove("show"); }
}
/* ================= confirm dialogs (archive / restore) ================= */
function confirmArchivePt(id){
  var t = ptById(id); if (!t) return;
  openDialog({
    title: 'Archive “' + t.name + '”?',
    desc: 'Archived templates disappear from “Use template” and the wizard picker, and new projects can\'t be created from them. Projects already created are unaffected. You can restore it later.',
    confirmLabel: "Archive", destructive: true,
    cb: function(){ t.status = "archived"; t.updated = "Just now"; save(); showToast("Project template archived.", "ok", "pt-archived"); render(); focusOrMain(['[data-tid="restore-pt-' + id + '"]', '[data-tid="pt-status"]']); },
    returnFocus: '[data-tid="archive-pt-' + id + '"]'
  });
}
function confirmRestorePt(id){
  var t = ptById(id); if (!t) return;
  openDialog({
    title: 'Restore “' + t.name + '”?',
    desc: 'It will be visible and usable for new projects again.',
    confirmLabel: "Restore",
    cb: function(){ t.status = "active"; t.updated = "Just now"; save(); showToast("Project template restored.", "ok", "pt-restored"); render(); focusOrMain(['[data-tid="archive-pt-' + id + '"]', '[data-tid="pt-status"]']); },
    returnFocus: '[data-tid="restore-pt-' + id + '"]'
  });
}
function confirmArchiveWf(id){
  var t = wfById(id); if (!t) return;
  openDialog({
    title: 'Archive “' + t.name + '”?',
    desc: 'Archived workflow templates are hidden from start pickers, and the server rejects starting them (proposed behavior). Existing projects and tasks are unaffected. You can restore it later.',
    confirmLabel: "Archive", destructive: true,
    cb: function(){ t.status = "archived"; t.updated = "Just now"; save(); showToast("Workflow template archived.", "ok", "wf-archived"); render(); focusOrMain(['[data-tid="restore-wf-' + id + '"]', '[data-tid="wf-status"]']); },
    returnFocus: '[data-tid="archive-wf-' + id + '"]'
  });
}
function confirmRestoreWf(id){
  var t = wfById(id); if (!t) return;
  openDialog({
    title: 'Restore “' + t.name + '”?',
    desc: 'It will appear in start pickers again.',
    confirmLabel: "Restore",
    cb: function(){ t.status = "active"; t.updated = "Just now"; save(); showToast("Workflow template restored.", "ok", "wf-restored"); render(); focusOrMain(['[data-tid="archive-wf-' + id + '"]', '[data-tid="wf-status"]']); },
    returnFocus: '[data-tid="restore-wf-' + id + '"]'
  });
}
/* patch: fix focus target used by openDialog */
function openDialog(d){
  S.dialog = d; S.focusReq = '[data-tid="dlg-cancel"]'; renderOverlays();
}
/* ================= boot ================= */
load();
document.addEventListener("click", onClick);
document.addEventListener("change", onChange);
document.addEventListener("input", onInput);
document.addEventListener("keydown", onKeydown);
window.addEventListener("resize", function(){ if (window.innerWidth > 980) closeSidebar(); });
document.addEventListener("keydown", function(ev){
  if (ev.key !== "Escape" || S.notesOpen || topmostOverlay()) return;
  var sb = document.getElementById("sidebar");
  if (sb && sb.classList.contains("open")){
    closeSidebar();
    var hb = document.querySelector('[data-tid="btn-hamburger"]');
    if (hb) hb.focus();
  }
});
render();
</script>
<style>
code{font-size:12px;background:var(--muted);padding:1px 5px;border-radius:5px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
</style>
<script>
/* ===== patch: fixes applied after first assembly pass ===== */
function bindIcons(root){
  if (!root) return;
  var els = root.querySelectorAll("[data-ico]");
  for (var i = 0; i < els.length; i++){
    var e = els[i]; var n = e.getAttribute("data-ico");
    e.removeAttribute("data-ico");
    e.innerHTML = '<svg class="' + (e.className || "icon") + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[n] || "") + '</svg>';
  }
}
function updateChrome(){
  document.documentElement.classList.toggle("dark", S.theme === "dark");
  var navs = document.querySelectorAll("[data-act='nav']");
  for (var i=0;i<navs.length;i++){
    var dv = navs[i].getAttribute("data-view");
    var cur = (S.view === "project" && dv === "projects") || (dv === S.view && !S.projId);
    if (cur) navs[i].setAttribute("aria-current","page"); else navs[i].removeAttribute("aria-current");
  }
  var p = PERSONS[S.persona];
  var av = document.getElementById("side-avatar"), av2 = document.getElementById("top-avatar");
  if (av){ av.textContent = p.initials; }
  if (av2){ av2.textContent = p.initials; av2.setAttribute("title", p.name + " — " + p.role); }
  var nm = document.getElementById("side-name"), rl = document.getElementById("side-role");
  if (nm) nm.textContent = p.name;
  if (rl) rl.textContent = p.role + " · simulated";
  var sbox = document.getElementById("global-search");
  if (sbox){
    var ph = "Search…";
    if (S.view === "projects" || (S.view === "project" && !S.projId)) ph = "Search projects…";
    else if (S.view === "templates") ph = S.sec === "project" ? "Search project templates…" : "Search workflow templates…";
    sbox.placeholder = ph;
    if (document.activeElement !== sbox) sbox.value = S.search;
  }
  var tb = document.querySelector("[data-act='toggle-theme'] .icon");
  if (tb) tb.innerHTML = ico(S.theme === "dark" ? "sun" : "moon");
  var strip = document.querySelector("[data-tid='strip-view']");
  if (strip){
    var lbl = S.view === "projects" ? "Projects · " + effProjects().length + " shown" :
      (S.view === "templates" ? "Templates hub · " + (S.sec === "project" ? "project" : "workflow") + " templates" :
      "Project detail · " + (S.tab === "overview" ? "Overview" : S.tab === "workflows" ? "Workflows" : S.tab === "tasks" ? "Tasks" : S.tab === "settings" ? "Settings" : "Other tab"));
    strip.textContent = lbl;
  }
  var psel = document.getElementById("persona-select"); if (psel && psel.value !== S.persona) psel.value = S.persona;
  var ssel = document.getElementById("scenario-select"); if (ssel && ssel.value !== S.scenario) ssel.value = S.scenario;
}
function render(){
  if (!S.sec) S.sec = "project";
  updateChrome();
  var main = document.getElementById("main-content");
  var h = "";
  if (S.view === "projects") h = renderProjects();
  else if (S.view === "templates") h = renderTemplates();
  else if (S.view === "project") h = renderProject();
  main.innerHTML = h;
  bindIcons(main);
  renderOverlays();
}
function onKeydown(ev){
  var container = topmostOverlay();
  if (ev.key === "Escape"){
    if (S.notesOpen){ S.notesOpen = false; renderNotes(); return; }
    if (S.dialog){ closeDialog(); return; }
    if (S.editor){ closeEditor(); return; }
    if (S.picker){ closePicker(); var m0 = document.getElementById("main-content"); if (m0) m0.focus(); return; }
    if (S.wizard){ wizCancelRequest(); return; }
    return;
  }
  if (ev.key === "Tab" && container){
    var fs = focusablesIn(container);
    if (fs.length === 0) return;
    var first = fs[0], last = fs[fs.length-1];
    if (ev.shiftKey && document.activeElement === first){ ev.preventDefault(); last.focus(); }
    else if (!ev.shiftKey && document.activeElement === last){ ev.preventDefault(); first.focus(); }
    else if (!container.contains(document.activeElement)){ ev.preventDefault(); first.focus(); }
    return;
  }
  if (ev.key === "Enter" || ev.key === " "){
    var t = ev.target;
    var el = t && t.closest ? t.closest('[role="button"][data-act], [role="radio"][data-act]') : null;
    if (el){ ev.preventDefault(); el.click(); }
  }
}
bindIcons(document.body);
render();
</script>
</body>
